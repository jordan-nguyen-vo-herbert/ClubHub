<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <title th:text="${club.clubName} + ' - ClubHub'">Club - ClubHub</title>
    <link rel="stylesheet" href="/styles.css" />
</head>
<body>
    <header th:replace="~{fragments/nav :: header}"></header>
    <section>
        <!--/* Only right after registering, a flash attribute lasts for one page view (FR-002-05). Plain for now, Daniel styles it in FR-002.8 */-->
        <div class="success" role="status" th:if="${registered}">
            <strong>Registration submitted.</strong>
            Your club registration was submitted and is waiting for approval.
            <a th:href="@{/clubs/mine}">View My Club Requests</a>
        </div>
        <h1 th:text="${club.clubName}">Club Name</h1>
        <ul>
            <li>Area of interest: <span th:text="${club.areaOfInterest.area}">Area</span></li>
            <!--/* The badge's color follows the status: status-pending, status-approved or status-rejected */-->
            <li>Status: <span class="status-badge" th:classappend="${'status-' + #strings.toLowerCase(club.status.name())}"
                              th:text="${club.status.status}">Pending</span></li>
        </ul>
        <p th:text="${club.description}">Description</p>
        <h2>Members</h2>
        <p th:if="${#lists.isEmpty(club.members)}">No members yet.</p>
        <!--/* Each member links to their student profile */-->
        <ul th:unless="${#lists.isEmpty(club.members)}">
            <li th:each="member : ${club.members}">
                <a th:href="@{/students/{id}(id=${member.studentID})}" th:text="${member.firstName} + ' ' + ${member.lastName}">First Last</a>
                - <span th:text="${member.role.role}">Regular Member</span>
            </li>
        </ul>
    </section>
</body>
</html>
