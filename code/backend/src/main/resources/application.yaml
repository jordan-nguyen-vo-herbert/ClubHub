spring:
  application:
    name: clubhub

  # Use local PostgreSQL when no other profile is specified
  profiles:
    default: local

server:
  servlet:
    session:
      tracking-modes: cookie

---
# LOCAL DEVELOPMENT: PostgreSQL in Docker
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://localhost:5432/clubhub
    username: clubhub
    password: clubhub_local_only
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true