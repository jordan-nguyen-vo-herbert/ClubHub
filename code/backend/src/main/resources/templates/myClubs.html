<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <title>My Club Requests - ClubHub</title>
    <link rel="stylesheet" href="/styles.css" />
</head>
<body>
    <header th:replace="~{fragments/nav :: header}"></header>
    <!--/* Plain page from the back end (FR-002.7), Daniel styles it in FR-002.8.
         Keep the model attribute and links: they are fixed in specs/features/club-registration/design.md */-->
    <section>
        <h1>My Club Requests</h1>
        <div th:if="${#lists.isEmpty(clubs)}">
            <p>No club requests yet.</p>
            <a th:href="@{/clubForm}">Register a club</a>
        </div>
        <!--/* ${clubs} holds only the signed-in student's clubs, newest first (FR-002-07) */-->
        <ul th:unless="${#lists.isEmpty(clubs)}">
            <li th:each="club : ${clubs}">
                <a th:href="@{/clubs/{id}(id=${club.clubID})}" th:text="${club.clubName}">Club Name</a>
                - <span th:text="${club.status.status}">Pending</span>
            </li>
        </ul>
    </section>
</body>
</html>
