<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <title th:text="${student.firstName} + ' ' + ${student.lastName} + ' - ClubHub'">Student Profile - ClubHub</title>
    <link rel="stylesheet" href="/styles.css" />
</head>
<body>
    <section>
        <h1 th:text="${student.firstName} + ' ' + ${student.lastName}">First Last</h1>
        <!--/* Pronouns are optional, only shown if set */-->
        <p th:if="${student.pronouns != null}" th:text="${student.pronouns.pronouns}">they/them</p>
        <ul>
            <li>Email: <span th:text="${student.email}">student@example.edu</span></li>
            <li>Major: <span th:text="${student.major} ?: 'Undeclared'">Major</span></li>
            <li th:if="${student.gender != null}">Gender: <span th:text="${student.gender.gender}">Gender</span></li>
        </ul>
    </section>
</body>
</html>
